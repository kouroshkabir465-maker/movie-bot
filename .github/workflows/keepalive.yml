name: Keepalive
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  k:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: { GH_TOKEN: "${{ github.token }}" }
        run: for w in daily.yml reply.yml welcome.yml keepalive.yml; do gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$w/enable"; done
      - run: |
          age=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          if [ "$age" -ge 30 ]; then
            date -u +%FT%TZ > .github/keepalive.txt
            git config user.name movie-bot; git config user.email movie-bot@users.noreply.github.com
            git add .github/keepalive.txt; git commit -m "keepalive $(date -u +%F)"; git push
          fi
